name: Generate Static SEO Pages for AX Board



on:

  schedule:

    - cron: '0 */6 * * *'

  workflow_dispatch:

  push:

    branches:

      - main

    paths:

      - 'index.html'

      - 'scripts/generate_posts_seo.mjs'



permissions:

  contents: write



jobs:

  build-seo:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: '20'



      - name: Generate post pages, sitemap.xml, and feed.xml

        run: node scripts/generate_posts_seo.mjs



      - name: Commit and push updated SEO files

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add posts/ sitemap.xml feed.xml

          if ! git diff --cached --quiet; then

            git commit -m "chore: update static SEO pages, sitemap, and RSS feed"

            git push

          else

            echo "No SEO changes to commit."

          fi

